<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rough Street | Sneakers</title>
  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <!-- ENCABEZADO PRINCIPAL -->
  <header class="top-header">
    <div class="brand-block">
      <span class="brand-kicker">SNEAKERS &amp; STREETWEAR // SUPABASE</span>
      <h1>ROUGH <span>STREET</span></h1>
    </div>
    <div class="header-stats">
      <a href="cliente.html" class="stat-pill link-cuenta">MI CUENTA ↗</a>
      <span class="stat-pill admin-pill">MODO ADMIN</span>
      <span id="contador-productos" class="stat-pill">0 PARES</span>
    </div>
  </header>

  <!-- ACCESO: primero el de clientes; la pestaña ADMIN cambia al de administradores.
       En cada uno, primero el login y el botón alterna con el registro -->
  <section id="zona-acceso-admin" class="acceso-admin">
    <div class="acceso-card">
      <div class="acceso-tabs" role="tablist">
        <button id="tab-cliente" type="button" role="tab" class="acceso-tab activa" aria-selected="true">CLIENTE</button>
        <button id="tab-admin" type="button" role="tab" class="acceso-tab" aria-selected="false">ADMIN</button>
      </div>
      <span id="acceso-kicker" class="acceso-kicker">ROUGH STREET // CLIENTES</span>
      <h2 id="acceso-titulo">INICIAR SESIÓN · CLIENTE</h2>
      <p id="estado-sesion-admin" role="status">No has iniciado sesión.</p>

      <!-- CLIENTES (tabla cliente_prueba) -->
      <form id="form-login-cliente">
        <div class="form-field">
          <label for="cliente-login-correo">Correo</label>
          <input id="cliente-login-correo" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="cliente-login-password">Contraseña</label>
          <input id="cliente-login-password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-acceso">ENTRAR ↗</button>
      </form>

      <form id="form-registro-cliente" hidden>
        <div class="form-field">
          <label for="cliente-registro-nombre">Nombre</label>
          <input id="cliente-registro-nombre" type="text" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="cliente-registro-correo">Correo</label>
          <input id="cliente-registro-correo" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="cliente-registro-password">Contraseña</label>
          <input id="cliente-registro-password" type="password" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-acceso">CREAR CUENTA ↗</button>
      </form>

      <!-- ADMINISTRADORES (tabla admin_prueba) -->
      <form id="form-login-admin" hidden>
        <div class="form-field">
          <label for="admin-login-correo">Correo</label>
          <input id="admin-login-correo" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="admin-login-password">Contraseña</label>
          <input id="admin-login-password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-acceso">ENTRAR ↗</button>
      </form>

      <form id="form-registro-admin" hidden>
        <div class="form-field">
          <label for="admin-registro-nombre">Nombre</label>
          <input id="admin-registro-nombre" type="text" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="admin-registro-correo">Correo</label>
          <input id="admin-registro-correo" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="admin-registro-password">Contraseña</label>
          <input id="admin-registro-password" type="password" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-acceso">CREAR CUENTA ↗</button>
      </form>

      <button id="btn-alternar-registro" type="button" class="btn-link-acceso">¿No tienes cuenta? Regístrate</button>
      <button id="btn-logout-admin" type="button" class="btn-link-acceso" hidden>CERRAR SESIÓN ✕</button>
    </div>
  </section>

  <!-- LAYOUT PRINCIPAL: FORMULARIO + CATÁLOGO -->
  <main class="main-layout">
    <!-- COLUMNA IZQUIERDA: FORMULARIO (CREATE / UPDATE) -->
    <aside class="panel-formulario">
      <form id="form-producto">
        <div class="form-header">
          <div>
            <span class="form-kicker">ROUGH STREET // NUEVO DROP</span>
            <h2>AGREGAR SNEAKER</h2>
          </div>
          <div class="form-badge-circle" title="Rough Street">↗</div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="input-marca">Marca <span>01</span></label>
            <input type="text" id="input-marca" placeholder="Ej: Nike" required />
          </div>

          <div class="form-field">
            <label for="input-sku">SKU <span>02</span></label>
            <input type="text" id="input-sku" placeholder="Ej: NK-DNK-PND-01" />
          </div>
        </div>

        <div class="form-field full">
          <label for="input-nombre">Modelo <span>03</span></label>
          <input type="text" id="input-nombre" placeholder="Ej: Nike Dunk Low Retro 'Panda'" required />
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="input-colorway">Colorway <span>04</span></label>
            <input type="text" id="input-colorway" placeholder="Ej: White / Black" />
          </div>

          <div class="form-field">
            <label for="input-categoria">Estilo <span>05</span></label>
            <input type="text" id="input-categoria" placeholder="Ej: Skate / Lifestyle" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="input-precio">Precio COP <span>06</span></label>
            <input type="number" id="input-precio" placeholder="Ej: 480000" min="0" step="any" required />
          </div>

          <div class="form-field">
            <label for="input-precio-usd">Precio USD <span>07</span></label>
            <input type="number" id="input-precio-usd" placeholder="Ej: 115" min="0" step="any" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="input-unidades">Stock <span>08</span></label>
            <input type="number" id="input-unidades" placeholder="Ej: 24" min="0" step="1" required />
          </div>

          <div class="form-field">
            <label for="input-badge">Badge <span>09</span></label>
            <input type="text" id="input-badge" placeholder="Ej: Best Seller" />
          </div>
        </div>

        <div class="form-field full">
          <label for="input-tallas">Tallas US <span>10</span></label>
          <input type="text" id="input-tallas" placeholder="Ej: 7, 7.5, 8, 8.5, 9" />
        </div>

        <div class="form-field full">
          <label for="input-descripcion">Descripción <span>11</span></label>
          <input type="text" id="input-descripcion" placeholder="Ej: Silueta clásica de los 80..." />
        </div>

        <div class="form-field full">
          <label for="input-imagen">URL de la imagen <span>12</span></label>
          <input type="text" id="input-imagen" placeholder="https://ejemplo.com/imagen.jpg" />
        </div>

        <button type="submit" id="btn-guardar-form">
          <span id="texto-btn-form">GUARDAR SNEAKER</span>
          <span class="btn-tag">ROUGH ST ↗</span>
        </button>
        <button type="button" id="btn-cancelar-edicion" class="btn-cancelar-form" style="display: none;">
          CANCELAR EDICIÓN ✕
        </button>
      </form>

      <div id="notificacion"></div>
    </aside>

    <!-- COLUMNA DERECHA: CATÁLOGO DE CARDS (READ / UPDATE / DELETE) -->
    <section class="panel-catalogo">
      <div class="catalogo-toolbar">
        <div class="toolbar-title">
          <span class="toolbar-kicker">INVENTARIO EN TIEMPO REAL</span>
          <h2>SNEAKERS DISPONIBLES</h2>
        </div>
        <div class="search-box">
          <input type="search" id="input-buscar" placeholder="Buscar por modelo o marca..." />
        </div>
      </div>

      <div id="contenedor-cards" class="cards-grid"></div>
    </section>
  </main>

  <script src="js/supabaseClient.js"></script>
  <script src="js/cuentaCliente.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
